openapi: 3.0.1
info:
  title: Customer 360 API
  description: |
    CRUD and business operations over two source systems consolidated in a GridGain 8.9 data hub:
    customer / order / loyalty data from MariaDB and travel / reservation data from Oracle, both replicated by CDC
    and joinable on customer_id (hub endpoints).

    * Resource endpoints read and write GridGain tables through SQL.
    * Business operations (`360`, `recalculate`, `scoring`, `POST /orders`) call the GridGain compute
      jobs that replace the former MariaDB stored procedures, so rules such as stock checks,
      loyalty points and tier changes are applied atomically on the node that owns the customer.
    * Timestamps are ISO-8601 UTC. Errors use RFC 7807 problem details.

    Note: while MariaDB is still the system of record, rows written through this API exist only in
    GridGain (CDC is one-way, MariaDB to GridGain).
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local Docker
tags:
- name: Customers
  description: Customer master data
- name: Addresses
  description: Customer addresses (nested under a customer)
- name: Products
  description: Product catalogue and stock
- name: Orders
  description: "Orders, line items and payments. Creating an order runs the place-order\
    \ job"
- name: Interactions
  description: Customer service interactions (nested under a customer)
- name: Loyalty
  description: "Loyalty tiers, points ledger and churn score (read-only data)"
- name: Operations
  description: Business operations implemented as GridGain compute jobs
- name: Airports
  description: Airport reference data (Oracle travel system)
- name: Flights
  description: "Flight schedule, seat inventory and operations: delay, cancel (Oracle\
    \ travel system)"
- name: Bookings
  description: Reservations. Booking and cancelling run the compute jobs that replaced
    the PL/SQL procedures
- name: Hub
  description: Endpoints that combine BOTH source systems (MariaDB customers x Oracle
    travel) plus disruption processing
- name: Dashboard
  description: Data behind the live dashboard page at /dashboard.html
paths:
  /api/v1/products/{productId}:
    get:
      tags:
      - Products
      summary: Get a product
      operationId: get
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Product"
    put:
      tags:
      - Products
      summary: Replace a product
      description: "Also the way to adjust price, stock or deactivate a product."
      operationId: update
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      tags:
      - Products
      summary: Delete a product
      description: Refused with 409 if any order line references it (set active=false
        instead).
      operationId: delete
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
  /api/v1/orders/{orderId}:
    get:
      tags:
      - Orders
      summary: Get an order with its line items and payments
      operationId: get_1
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Order"
    put:
      tags:
      - Orders
      summary: Change an order's sales channel
      description: "Totals, items and status are produced by the place-order job and\
        \ are not editable."
      operationId: update_1
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      tags:
      - Orders
      summary: Delete a cancelled order
      description: Only CANCELLED orders can be deleted (409 otherwise).
      operationId: delete_1
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
  /api/v1/flights/{flightId}:
    get:
      tags:
      - Flights
      summary: Get a flight with its seat inventory
      operationId: get_2
      parameters:
      - name: flightId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Flight"
    put:
      tags:
      - Flights
      summary: Change a flight's schedule details
      description: Only flights that have not operated (SCHEDULED or DELAYED) can
        be edited. Status and delay change through the delay and cancel operations.
      operationId: update_2
      parameters:
      - name: flightId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Flight"
    delete:
      tags:
      - Flights
      summary: Delete a flight
      description: Refused with 409 if any booking segment references it (cancel the
        flight instead).
      operationId: delete_2
      parameters:
      - name: flightId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
  /api/v1/customers/{customerId}:
    get:
      tags:
      - Customers
      summary: Get a customer
      operationId: get_3
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Customer"
    put:
      tags:
      - Customers
      summary: Replace a customer's editable fields
      description: "Loyalty tier and points are not editable here: they change through\
        \ orders and the recalculate operation."
      operationId: update_3
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      tags:
      - Customers
      summary: Delete a customer
      description: "Refused with 409 if the customer has orders (set status INACTIVE\
        \ instead). Otherwise also removes their addresses, interactions, loyalty\
        \ transactions and score."
      operationId: delete_3
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
  /api/v1/customers/{customerId}/interactions/{interactionId}:
    get:
      tags:
      - Interactions
      summary: Get an interaction
      operationId: get_4
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: interactionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Interaction"
    put:
      tags:
      - Interactions
      summary: Replace an interaction
      description: Closing it stamps closedAt; re-opening clears it.
      operationId: update_4
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: interactionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Interaction"
    delete:
      tags:
      - Interactions
      summary: Delete an interaction
      operationId: delete_4
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: interactionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
  /api/v1/customers/{customerId}/addresses/{addressId}:
    get:
      tags:
      - Addresses
      summary: Get an address
      operationId: get_5
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: addressId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Address"
    put:
      tags:
      - Addresses
      summary: Replace an address
      operationId: update_5
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: addressId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Address"
    delete:
      tags:
      - Addresses
      summary: Delete an address
      operationId: delete_5
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: addressId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
  /api/v1/scoring/run:
    post:
      tags:
      - Operations
      summary: Score all active customers for churn risk
      description: Runs one job per cluster node; each scores the customers it owns
        and upserts customer_score (replaces sp_score_customers). Returns the number
        of customers and average score per risk band.
      operationId: score
      parameters:
      - name: asOf
        in: query
        description: Score as of this instant (ISO-8601); defaults to now
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-10-14T12:00:00Z
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
  /api/v1/products:
    get:
      tags:
      - Products
      summary: List products
      operationId: list
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - FLIGHT
          - HOTEL
          - LOUNGE
          - UPGRADE
          - INSURANCE
          - ANCILLARY
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: q
        in: query
        description: Case-insensitive fragment of the name
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageProduct"
    post:
      tags:
      - Products
      summary: Create a product
      description: SKU must be unique.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Product"
  /api/v1/orders:
    get:
      tags:
      - Orders
      summary: List orders
      description: "Newest first. Line items and payments are only included by GET\
        \ /orders/{id}."
      operationId: list_1
      parameters:
      - name: customerId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - NEW
          - COMPLETED
          - CANCELLED
      - name: limit
        in: query
        required: false
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageOrder"
    post:
      tags:
      - Orders
      summary: Place an order
      description: "Runs the place-order compute job: one transaction on the customer's\
        \ node that checks stock, decrements it, creates the order, line items and\
        \ payment, awards loyalty points at the customer's current tier and recalculates\
        \ the tier. All-or-nothing: if any line fails nothing changes. 409 = insufficient\
        \ stock, 404 = unknown or inactive customer, 400 = bad quantity or unknown\
        \ product."
      operationId: place
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlaceOrderResult"
  /api/v1/offers/generate:
    post:
      tags:
      - Offers
      summary: Generate offers
      description: "Runs the recommender job on every cluster node; each node scores\
        \ the products for the customers it owns from their order history (recency-weighted\
        \ category affinity, what similar-tier customers buy, repurchase of consumables,\
        \ an upcoming or disrupted flight from the Oracle travel data) and writes\
        \ the top offers to customer_offer, replacing the customer's previous ones.\
        \ Discounts come from loyalty tier, churn risk and flight disruption (max\
        \ 20%). Pass customerId to generate for one customer only (404 if unknown\
        \ or inactive). Nothing leaves the cluster."
      operationId: generate
      parameters:
      - name: topN
        in: query
        description: Offers per customer
        required: false
        schema:
          maximum: 10
          minimum: 1
          type: integer
          format: int32
          default: 3
      - name: customerId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferRun"
  /api/v1/flights:
    get:
      tags:
      - Flights
      summary: List flights
      description: "Filter by route, status and departure window; soonest first."
      operationId: list_3
      parameters:
      - name: origin
        in: query
        description: Origin IATA code
        required: false
        schema:
          type: string
        example: DXB
      - name: destination
        in: query
        description: Destination IATA code
        required: false
        schema:
          type: string
        example: LHR
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - SCHEDULED
          - DELAYED
          - CANCELLED
          - DEPARTED
          - ARRIVED
      - name: from
        in: query
        description: Departing at or after (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Departing before (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageFlight"
    post:
      tags:
      - Flights
      summary: Create a flight
      description: Starts SCHEDULED with no delay. Provide the seat inventory per
        cabin (seats and base fare).
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Flight"
  /api/v1/flights/{flightId}/delay:
    post:
      tags:
      - Flights
      summary: Record a delay
      description: "Runs the record-delay job (replaces sp_record_delay): sets the\
        \ flight DELAYED with the delay in minutes, writes a flight event and returns\
        \ how many confirmed bookings are affected. 409 if the flight has already\
        \ operated or is cancelled."
      operationId: delay
      parameters:
      - name: flightId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelayRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FlightOpResult"
  /api/v1/flights/{flightId}/cancel:
    post:
      tags:
      - Flights
      summary: Cancel a flight
      description: Runs the cancel-flight job (replaces sp_cancel_flight). Passengers'
        compensation is then produced by POST /disruptions/process.
      operationId: cancel
      parameters:
      - name: flightId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelFlightRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FlightOpResult"
  /api/v1/disruptions/process:
    post:
      tags:
      - Hub
      summary: Compute compensation for disrupted flights
      description: "Runs the process-disruptions job (replaces sp_process_disruptions),\
        \ one job per node: every segment on a cancelled flight (100% of the fare)\
        \ or on a flight delayed by at least minDelay minutes (75% from 720 min, 50%\
        \ from 360, otherwise 25%) gets a compensation row. Returns segments and total\
        \ amount per reason."
      operationId: process
      parameters:
      - name: minDelay
        in: query
        required: false
        schema:
          maximum: 1440
          minimum: 1
          type: integer
          format: int32
          default: 180
      - name: asOf
        in: query
        description: Compute as of this instant (ISO-8601); defaults to now
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-10-15T12:00:00Z
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
  /api/v1/customers:
    get:
      tags:
      - Customers
      summary: List customers
      description: "Filter by status, loyalty tier, exact email, or a name fragment;\
        \ paged."
      operationId: list_4
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      - name: tier
        in: query
        required: false
        schema:
          type: string
          enum:
          - BLUE
          - SILVER
          - GOLD
          - PLATINUM
      - name: email
        in: query
        description: "Exact email, case-insensitive"
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: Case-insensitive fragment of first or last name
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageCustomer"
    post:
      tags:
      - Customers
      summary: Create a customer
      description: New customers start at tier BLUE with 0 points. Email must be unique
        (case-insensitive).
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Customer"
  /api/v1/customers/{customerId}/loyalty/recalculate:
    post:
      tags:
      - Operations
      summary: Recalculate a customer's loyalty tier
      description: Derives the tier from trailing-12-month completed spend and updates
        the customer if it changed (replaces sp_recalc_loyalty_tier).
      operationId: recalculate
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/v1/customers/{customerId}/interactions:
    get:
      tags:
      - Interactions
      summary: List a customer's service interactions
      description: Newest first.
      operationId: list_5
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
      - name: limit
        in: query
        required: false
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageInteraction"
    post:
      tags:
      - Interactions
      summary: Log an interaction
      operationId: create_3
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Interaction"
  /api/v1/customers/{customerId}/addresses:
    get:
      tags:
      - Addresses
      summary: List a customer's addresses
      operationId: list_6
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      tags:
      - Addresses
      summary: Add an address
      description: Marking it primary clears the flag on the customer's other addresses.
      operationId: create_4
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Address"
  /api/v1/bookings:
    get:
      tags:
      - Bookings
      summary: List bookings
      description: "Newest first. customerId is the MariaDB customer id. Segments\
        \ are only included by GET /bookings/{id}."
      operationId: list_7
      parameters:
      - name: customerId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
      - name: flightId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageBooking"
    post:
      tags:
      - Bookings
      summary: Book a flight
      description: "Runs the book-flight job (replaces sp_book_flight): one transaction\
        \ on the customer's node that takes a seat from the flight's cabin inventory,\
        \ assigns the next seat number and creates the booking and its segment, with\
        \ miles earned. 404 flight not found, 409 flight not open or cabin sold out,\
        \ 400 bad cabin or passenger."
      operationId: book
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookFlightRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookFlightResult"
  /api/v1/bookings/{bookingId}/cancel:
    post:
      tags:
      - Bookings
      summary: Cancel a booking
      description: "Runs the cancel-booking job (replaces sp_cancel_booking): cancels\
        \ every future segment, releases the seats and returns the refund (more than\
        \ 72 h before departure 90%, more than 24 h 50%, otherwise nothing). 404 unknown,\
        \ 409 already cancelled or nothing to cancel."
      operationId: cancel_1
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CancelBookingResult"
  /api/v1/offers:
    get:
      tags:
      - Offers
      summary: List offers
      description: "Filter by customer or product category; ordered by customer, then\
        \ rank."
      operationId: list_2
      parameters:
      - name: customerId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - FLIGHT
          - HOTEL
          - LOUNGE
          - UPGRADE
          - INSURANCE
          - ANCILLARY
      - name: limit
        in: query
        required: false
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageOffer"
  /api/v1/loyalty-tiers:
    get:
      tags:
      - Loyalty
      summary: List loyalty tiers
      description: Spend thresholds (trailing 12 months) and points multipliers.
      operationId: tiers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoyaltyTier"
  /api/v1/flights/{flightId}/impact:
    get:
      tags:
      - Flights
      summary: "Hub: who is affected by a disruption, ranked by customer value"
      description: "Joins the flight's passengers (Oracle) with their customers (MariaDB):\
        \ loyalty tier, points and completed-order spend. Passengers are ranked by\
        \ priority (tier, cabin, retail spend) and each gets the base compensation\
        \ for the flight's delay or cancellation and a tier-weighted suggested amount\
        \ (MariaDB's loyalty multiplier). Runs one job per cluster node on the data\
        \ it owns."
      operationId: impact
      parameters:
      - name: flightId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/v1/flights/{flightId}/events:
    get:
      tags:
      - Flights
      summary: Operational events for a flight
      description: "Delays and cancellations, oldest first."
      operationId: events
      parameters:
      - name: flightId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlightEvent"
  /api/v1/dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: "Table sizes, CDC status and REST totals"
      description: "Row counts per table in GridGain and (as last counted by the CDC\
        \ reader) in MariaDB, CDC position, lag and cumulative counters, REST request\
        \ totals and the GridGain server nodes. Refreshed every 2-5 seconds."
      operationId: summary
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Summary"
  /api/v1/dashboard/series:
    get:
      tags:
      - Dashboard
      summary: Throughput time series for the live graphs
      description: "One sample every 2 seconds for the last 15 minutes: REST requests/s\
        \ (reads, writes, errors, average latency) and CDC events/s (upserts, deletes),\
        \ backlog and latency. Pass since=<epoch ms of the last sample you have> to\
        \ get only newer samples."
      operationId: series
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Series"
  /api/v1/dashboard/offers:
    get:
      tags:
      - Dashboard
      summary: Offer totals for the dashboard
      description: "How many offers exist, for how many customers, the average discount,\
        \ the split by category and the strongest offers."
      operationId: offers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferSummary"
  /api/v1/customers/{customerId}/trips:
    get:
      tags:
      - Hub
      summary: A customer's trips (Oracle)
      description: "Runs the customer-trips job (replaces sp_customer_trips): upcoming\
        \ trips, past trips and statistics. Returns an empty result for a customer\
        \ with no bookings."
      operationId: trips
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/v1/customers/{customerId}/score:
    get:
      tags:
      - Loyalty
      summary: A customer's latest churn score
      description: Produced by POST /scoring/run; 404 if not yet scored.
      operationId: score_1
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerScore"
  /api/v1/customers/{customerId}/offers:
    get:
      tags:
      - Offers
      summary: A customer's current offers
      description: Best first. Empty until offers have been generated for the customer.
      operationId: forCustomer
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"
  /api/v1/customers/{customerId}/loyalty-transactions:
    get:
      tags:
      - Loyalty
      summary: A customer's points ledger
      description: Newest first. Written by the place-order job.
      operationId: transactions
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageLoyaltyTransaction"
  /api/v1/customers/{customerId}/hub:
    get:
      tags:
      - Hub
      summary: "Hub: one customer view across BOTH source systems"
      description: "Joins data that no single source holds. From MariaDB: profile,\
        \ loyalty tier and points, completed orders. From Oracle: bookings, miles,\
        \ upcoming trips and the ones on delayed or cancelled flights. Also combines\
        \ them: lifetime_value = retail spend + travel spend. Sections: profile, retail,\
        \ travel, upcoming_trips, at_risk_trips, value."
      operationId: hub
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/v1/customers/{customerId}/360:
    get:
      tags:
      - Operations
      summary: Customer 360 view
      description: "Runs the customer-360 job on the node that owns the customer (replaces\
        \ sp_customer_360). Returns six sections: profile, order_summary, recent_orders,\
        \ top_categories, interactions, loyalty. Each section is a list of rows (objects\
        \ with snake_case column names)."
      operationId: customer360
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/v1/compensation:
