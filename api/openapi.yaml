components:
  schemas:
    ProductInput:
      required:
      - category
      - name
      - sku
      - stockQty
      - unitPrice
      type: object
      properties:
        sku:
          maxLength: 20
          minLength: 0
          type: string
        name:
          maxLength: 100
          minLength: 0
          type: string
        category:
          pattern: FLIGHT|HOTEL|LOUNGE|UPGRADE|INSURANCE|ANCILLARY
          type: string
        unitPrice:
          minimum: 0
          type: number
        stockQty:
          minimum: 0
          type: integer
          format: int32
        active:
          type: boolean
          description: Defaults to true
    Product:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        unitPrice:
          type: number
        stockQty:
          type: integer
          format: int32
        active:
          type: boolean
    OrderUpdate:
      required:
      - channel
      type: object
      properties:
        channel:
          pattern: WEB|APP|CALL|AGENT
          type: string
    Order:
      type: object
      properties:
        orderId:
          type: integer
          format: int32
        customerId:
          type: integer
          format: int32
        orderDate:
          type: string
          format: date-time
        status:
          type: string
        channel:
          type: string
        totalAmount:
          type: number
        currency:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
    OrderItem:
      type: object
      properties:
        orderItemId:
          type: integer
          format: int32
        orderId:
          type: integer
          format: int32
        productId:
          type: integer
          format: int32
        qty:
          type: integer
          format: int32
        unitPrice:
          type: number
        lineTotal:
          type: number
    Payment:
      type: object
      properties:
        paymentId:
          type: integer
          format: int32
        orderId:
          type: integer
          format: int32
        method:
          type: string
        amount:
          type: number
        status:
          type: string
        paidAt:
          type: string
          format: date-time
    FlightInput:
      required:
      - arrTime
      - depTime
      - destination
      - distanceKm
      - flightNo
      - origin
      type: object
      properties:
        flightNo:
          maxLength: 8
          minLength: 0
          type: string
        origin:
          maxLength: 3
          minLength: 3
          type: string
        destination:
          maxLength: 3
          minLength: 3
          type: string
        depTime:
          type: string
          format: date-time
        arrTime:
          type: string
          format: date-time
        distanceKm:
          minimum: 1
          type: integer
          format: int32
        aircraft:
          maxLength: 10
          minLength: 0
          type: string
        inventory:
          type: array
          description: Seat inventory per cabin. Required when creating; ignored by
            PUT (inventory changes with bookings)
          items:
            $ref: "#/components/schemas/InventoryInput"
    InventoryInput:
      required:
      - baseFare
      - cabin
      - seats
      type: object
      properties:
        cabin:
          pattern: ECONOMY|BUSINESS|FIRST
          type: string
        seats:
          maximum: 600
          minimum: 1
          type: integer
          format: int32
        baseFare:
          minimum: 0
          type: number
      description: Seat inventory per cabin. Required when creating; ignored by PUT
        (inventory changes with bookings)
    Flight:
      type: object
      properties:
        flightId:
          type: integer
          format: int32
        flightNo:
          type: string
        origin:
          type: string
        destination:
          type: string
        depTime:
          type: string
          format: date-time
        arrTime:
          type: string
          format: date-time
        distanceKm:
          type: integer
          format: int32
        aircraft:
          type: string
        status:
          type: string
        delayMinutes:
          type: integer
          format: int32
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/FlightInventory"
    FlightInventory:
      type: object
      properties:
        cabin:
          type: string
        seatsTotal:
          type: integer
          format: int32
        seatsAvailable:
          type: integer
          format: int32
        baseFare:
          type: number
    CustomerInput:
      required:
      - email
      - firstName
      - lastName
      type: object
      properties:
        firstName:
          maxLength: 60
          minLength: 0
          type: string
        lastName:
          maxLength: 60
          minLength: 0
          type: string
        email:
          maxLength: 120
          minLength: 0
          type: string
        phone:
          maxLength: 30
          minLength: 0
          type: string
        dateOfBirth:
          type: string
          format: date
        nationality:
          maxLength: 2
          minLength: 2
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: AE
        segment:
          pattern: STANDARD|PREMIUM|CORPORATE
          type: string
          description: Defaults to STANDARD
          enum:
          - STANDARD
          - PREMIUM
          - CORPORATE
        marketingOptIn:
          type: boolean
          description: Defaults to false
        status:
          pattern: ACTIVE|INACTIVE
          type: string
          description: Defaults to ACTIVE
          enum:
          - ACTIVE
          - INACTIVE
    Customer:
      type: object
      properties:
        customerId:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: string
          format: date
        nationality:
          type: string
        segment:
          type: string
        loyaltyTier:
          type: string
        loyaltyPoints:
          type: integer
          format: int32
        marketingOptIn:
          type: boolean
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InteractionInput:
      required:
      - channel
      - type
