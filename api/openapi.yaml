      properties:
        channel:
          pattern: CALL|EMAIL|CHAT|SOCIAL
          type: string
        type:
          pattern: COMPLAINT|ENQUIRY|FEEDBACK|BOOKING_CHANGE
          type: string
        subject:
          maxLength: 200
          minLength: 0
          type: string
        sentiment:
          maximum: 1
          minimum: -1
          type: integer
          description: "-1 negative, 0 neutral, 1 positive; defaults to 0"
          format: int32
        status:
          pattern: OPEN|CLOSED
          type: string
          description: Defaults to OPEN. Closing sets closedAt
    Interaction:
      type: object
      properties:
        interactionId:
          type: integer
          format: int32
        customerId:
          type: integer
          format: int32
        channel:
          type: string
        type:
          type: string
        subject:
          type: string
        sentiment:
          type: integer
          format: int32
        status:
          type: string
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
    AddressInput:
