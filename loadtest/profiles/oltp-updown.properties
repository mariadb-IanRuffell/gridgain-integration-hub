# OLTP mix ramping up to a peak and back down, then once more: about 8 minutes. Meant to exercise the cluster, not to break it:
# the governor lowers the load when latency or errors cross the limits, and the run stops if a node drops out.
rows=100000
mix_read=60
mix_update=15
mix_insert=5
mix_range=10
mix_tx=10
key_skew=2.0
max_insert_rows=50000
peak_threads=32
min_threads=2
ramp_up_sec=90
hold_sec=30
ramp_down_sec=90
cycles=2
window_sec=5
slo_p95_ms=250
slo_error_pct=1
breach_windows=2
recover_windows=3
abort_error_pct=20
abort_windows=3
query_timeout_sec=5
nodes_expected=3
max_threads=64
